name: Live Deepgram worker benchmark

on:
  workflow_call:
    inputs:
      benchmark_sha:
        description: Exact commit to benchmark
        required: true
        type: string
      enforce:
        description: Fail on connectivity, protocol, transport, or quality threshold failures
        type: boolean
        default: true
      max_wer:
        description: Maximum aggregate word error rate for the frozen clean-speech canary
        type: number
        default: 0.10
      max_cer:
        description: Maximum aggregate character error rate for the frozen clean-speech canary
        type: number
        default: 0.08
    secrets:
      SAYALL_DEEPGRAM_BENCHMARK_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail on connectivity, protocol, transport, or quality threshold failures
        type: boolean
        default: false
      qualification:
        description: Run the extended clean, 10 dB, and 5 dB human-speech corpus twice
        type: boolean
        default: false
      max_wer:
        description: Maximum aggregate word error rate for the frozen clean-speech canary
        type: number
        default: 0.10
      max_cer:
        description: Maximum aggregate character error rate for the frozen clean-speech canary
        type: number
        default: 0.08
  schedule:
    # Provider models can change independently of SayAll releases.
    - cron: '17 8 * * 1'

concurrency:
  group: deepgram-live-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BENCHMARK_SHA: ${{ inputs.benchmark_sha || github.sha }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCHMARK_SHA }}
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: 0.16.0
      - name: Unit tests and worker build
        run: |
          python3 -m unittest discover -s tests/deepgram_benchmark -p 'test_*.py'
          zig build process -Doptimize=ReleaseSafe
      - name: Download previous benchmark and matching HUD renders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p benchmark-history/previous hud-renders/macos hud-renders/linux
          echo 'PREVIOUS_REPORT=' >> "$GITHUB_ENV"
          echo 'PREVIOUS_RUN_URL=' >> "$GITHUB_ENV"
          echo 'UI_RUN_URL=' >> "$GITHUB_ENV"

          benchmark_artifacts=''
          if ! benchmark_artifacts=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("deepgram-benchmark-"))) | [.workflow_run.id, .name] | @tsv' 2>/dev/null); then
            echo '::warning::Could not query previous benchmark artifacts; continuing without a baseline.'
          fi
          candidate_count=0
          while IFS=$'\t' read -r previous_id artifact_name; do
            [[ -n "${previous_id:-}" ]] || continue
            previous_conclusion=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$previous_id" \
              --jq .conclusion 2>/dev/null) || continue
            [[ $previous_conclusion == success ]] || continue
            ((candidate_count += 1))
            [[ $candidate_count -le 10 ]] || break
            candidate="benchmark-history/candidate-$candidate_count-$previous_id"
            if gh run download "$previous_id" --name "$artifact_name" \
              --dir "$candidate" >/dev/null 2>&1; then
              previous_report=$(find "$candidate" -name deepgram-benchmark.json -type f -size +0c -print -quit)
              if [[ -n "$previous_report" ]]; then
                echo "PREVIOUS_REPORT=$previous_report" >> "$GITHUB_ENV"
                echo "PREVIOUS_RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$previous_id" >> "$GITHUB_ENV"
                break
              fi
            fi
          done <<< "$benchmark_artifacts"
          if [[ -z "${previous_report:-}" ]]; then
            echo '::warning::No retained previous benchmark report was available.'
          fi

          ci_runs=''
          if ! ci_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BENCHMARK_SHA&status=success&per_page=10" \
            --jq '.workflow_runs[] | [.id, .html_url] | @tsv' 2>/dev/null); then
            echo '::warning::Could not query matching CI runs; continuing without HUD screenshots.'
          fi
          while IFS=$'\t' read -r ci_id ci_url; do
            [[ -n "${ci_id:-}" ]] || continue
            candidate="benchmark-history/ci-$ci_id"
            mkdir -p "$candidate/macos" "$candidate/linux"
            mac=false; linux=false
            gh run download "$ci_id" --name macos-hud-renders --dir "$candidate/macos" >/dev/null 2>&1 && mac=true
            gh run download "$ci_id" --name linux-hud-renders --dir "$candidate/linux" >/dev/null 2>&1 && linux=true
            if $mac && $linux; then
              cp -a "$candidate/macos/." hud-renders/macos/
              cp -a "$candidate/linux/." hud-renders/linux/
              echo "UI_RUN_URL=$ci_url" >> "$GITHUB_ENV"
              break
            fi
          done <<< "$ci_runs"
          if ! find hud-renders -name '*.png' -print -quit | grep -q .; then
            echo '::warning::No retained macOS and Linux HUD screenshot pair matched this commit.'
          fi
      - name: Run live REST and streaming canaries
        id: live
        env:
          SAYALL_DEEPGRAM_BENCHMARK_API_KEY: ${{ secrets.SAYALL_DEEPGRAM_BENCHMARK_API_KEY }}
        run: |
          enforce=''
          if [[ '${{ inputs.enforce }}' == 'true' || '${{ github.event_name }}' == 'schedule' ]]; then enforce=--enforce; fi
          max_wer='${{ inputs.max_wer }}'; [[ -n "$max_wer" ]] || max_wer=0.10
          max_cer='${{ inputs.max_cer }}'; [[ -n "$max_cer" ]] || max_cer=0.08
          corpus_args=(--runs 5)
          if [[ '${{ inputs.qualification }}' == 'true' ]]; then
            corpus_args=(--manifest tests/deepgram_benchmark/manifest-v3.json --runs 2)
          fi
          python3 tests/deepgram_benchmark/benchmark.py --mode both $enforce "${corpus_args[@]}" \
            --max-wer "$max_wer" --max-cer "$max_cer" \
            --output deepgram-benchmark.json
      - name: Build current-versus-previous report
        id: report
        if: always()
        run: |
          args=(
            --current deepgram-benchmark.json
            --hud-dir hud-renders
            --markdown benchmark-comparison.md
            --html benchmark-report.html
            --current-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          )
          if [[ -n "${PREVIOUS_REPORT:-}" ]]; then
            args+=(--previous "$PREVIOUS_REPORT" --previous-run-url "$PREVIOUS_RUN_URL")
          fi
          if [[ -n "${UI_RUN_URL:-}" ]]; then args+=(--ui-run-url "$UI_RUN_URL"); fi
          python3 tests/deepgram_benchmark/compare.py "${args[@]}"
          test -s benchmark-comparison.md
          test -s benchmark-report.html
          if [[ '${{ steps.live.outcome }}' != 'skipped' ]]; then
            test -s deepgram-benchmark.json
          fi
          cat benchmark-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload privacy-safe evidence report
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deepgram-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deepgram-benchmark.json
            benchmark-comparison.md
            benchmark-report.html
            hud-renders
          if-no-files-found: error
          retention-days: 90
